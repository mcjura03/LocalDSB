<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vertretungsplan - vSG</title>
  <meta http-equiv="refresh" content="300">
  <style>
    body {
      margin: 0;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      position: relative;
      font-family: Arial, sans-serif;
    }

    /* geblurrter Hintergrund */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background-image: url("bg.jpg");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      filter: blur(12px);
      transform: scale(1.05);
      z-index: -1;
    }

    #header {
      background-color: rgba(51, 51, 51, 0.92);
      color: white;
      display: flex;
      align-items: center;
      padding: 10px;
      font-size: 1.5em;
      font-family: Arial, sans-serif;
      backdrop-filter: blur(2px);
    }

    #header img {
      height: 40px;
      margin-right: 15px;
    }

    #viewerContainer {
      display: flex;
      flex: 1;
      overflow: hidden;
      position: relative;
      padding: 12px;
      box-sizing: border-box;
    }

    .pane {
      width: 50%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    canvas {
      display: block;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.35);
      background: rgba(255,255,255,0.02);
    }

    .noPlan {
      position: absolute;
      inset: 0;
      display: none; /* JS schaltet ein/aus */
      align-items: center;
      justify-content: center;
      text-align: center;
      font-size: 42px;
      font-weight: 700;
      color: white;
      padding: 20px;

      border-radius: 18px;
      background: rgba(0,0,0,0.55);
      box-shadow: 0 10px 30px rgba(0,0,0,0.35);
      margin: 0 10%;
      height: 80%;
      top: 10%;
      bottom: 10%;
      left: 10%;
      right: 10%;
    }

    #ticker {
      position: absolute;
      left: 12px;
      right: 12px;
      bottom: 12px;
      height: 42px;
      background: rgba(0,0,0,0.75);
      color: #fff;
      overflow: hidden;
      border-radius: 12px;
      border: 2px solid rgba(255,255,255,0.15);
      font-family: Arial, sans-serif;
      z-index: 5;
      backdrop-filter: blur(2px);
    }

    #tickerText {
      position: absolute;
      white-space: nowrap;
      line-height: 42px;
      font-size: 22px;
      padding-left: 100%;
      will-change: transform;
      animation: ticker 30s linear infinite;
    }

    @keyframes ticker {
      from { transform: translateX(0); }
      to   { transform: translateX(-100%); }
    }
  </style>
</head>

<body>
  <div id="header">
    <img src="logo.jpg" alt="Logo">
    <span>Vertretungsplan - vSG</span>
  </div>

  <div id="viewerContainer">
    <div class="pane">
      <canvas id="leftCanvas"></canvas>
      <div id="leftNoPlan" class="noPlan">Kein Plan verfügbar</div>
    </div>

    <div class="pane">
      <canvas id="rightCanvas"></canvas>
      <div id="rightNoPlan" class="noPlan">Kein Plan verfügbar</div>
    </div>

    <div id="ticker"><div id="tickerText"></div></div>
  </div>

  <script type="module" src="kiosk.js"></script>
</body>
</html>
